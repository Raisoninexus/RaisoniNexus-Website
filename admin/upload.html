<!DOCTYPE html>
<html lang="en">
  <head><meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" /><title>Upload Resource | Raisoni Nexus</title><link rel="stylesheet" href="../assets/css/style.css" /><link rel="stylesheet" href="../assets/css/admin.css" /><link rel="stylesheet" href="../assets/css/themes.css" /><link rel="stylesheet" href="../assets/css/responsive.css" /></head>
  <body class="admin-body">
    <div class="admin-shell">
      <aside class="admin-sidebar open"><div class="admin-brand"><span class="brand-mark">RN</span><strong>Raisoni Nexus</strong></div><nav class="admin-nav"><a href="dashboard.html">Dashboard</a><a href="resources.html">Resources</a><a class="active" href="upload.html">Upload Resource</a><a href="branches.html">Branches</a><a href="semesters.html">Semesters</a><a href="subjects.html">Subjects</a><a href="users.html">Users</a><a href="notices.html">Notices</a><a href="analytics.html">Analytics</a><a href="settings.html">Settings</a><a href="login.html">Logout</a></nav></aside>
      <main class="admin-main"><div class="admin-topbar"><div><button class="primary-btn admin-sidebar-toggle">☰ Menu</button></div><div><strong>Upload Resource</strong></div><div><a class="secondary-btn" href="resources.html">Back</a></div></div><div class="form-panel"><form id="resourceUploadForm"><div class="form-grid"><div class="full"><label for="resourceTitle">Resource title</label><input class="input" id="resourceTitle" name="title" type="text" placeholder="Resource title" required /></div><div class="full"><label for="resourceDescription">Description</label><textarea class="textarea" id="resourceDescription" name="description" rows="4" placeholder="Description"></textarea></div><div><label for="resourceBranch">Branch</label><select class="select" id="resourceBranch" name="branch_id" required><option value="">Choose branch</option></select></div><div><label for="resourceSemester">Semester</label><select class="select" id="resourceSemester" name="semester_id" required><option value="">Choose semester</option></select></div><div><label for="resourceSubject">Subject</label><select class="select" id="resourceSubject" name="subject_id" required><option value="">Choose subject</option></select></div><div><label for="resourceType">Resource type</label><select class="select" id="resourceType" name="resource_type" required><option value="Notes">Notes</option><option value="PYQ">PYQ</option><option value="Question Bank">Question Bank</option><option value="Assignment">Assignment</option><option value="Lab Manual">Lab Manual</option><option value="Syllabus">Syllabus</option></select></div><div><label for="resourceYear">Academic year</label><input class="input" id="resourceYear" name="academic_year" type="text" placeholder="2025-26" /></div><div><label for="resourceTags">Tags</label><input class="input" id="resourceTags" name="tags" type="text" placeholder="unit 1, revision" /></div><div class="full"><label for="resourceFile">File (maximum 20 MB)</label><input class="input" id="resourceFile" name="file" type="file" accept=".pdf,.doc,.docx,.ppt,.pptx,.zip" required /></div><div><label for="resourceStatus">Publication status</label><select class="select" id="resourceStatus" name="status"><option value="draft">Draft</option><option value="published">Published</option></select></div><div class="full"><button class="primary-btn" type="submit">Upload resource</button></div></div></form></div></main>
    </div>
    <script src="../assets/js/theme.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../assets/js/supabase-config.js"></script>
  <script src="../assets/js/supabase.js"></script>
  <script src="../assets/js/admin.js"></script>
  </body>
</html>
